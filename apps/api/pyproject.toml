[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zuvoora-engage-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic[email]>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.3,<4.0",
  "psycopg-pool>=3.3,<4.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "cryptography>=50.0,<51.0",
  "dnspython>=2.7,<3.0",
  "python-multipart>=0.0.20,<0.1",
  "pypdf>=7.1,<8.0",
  "python-docx>=1.2,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "pyotp>=2.9,<3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `tests.*` helpers importable however pytest is launched (`pytest` in CI, `python -m pytest`).
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: requires the local Supabase stack (npm run db:start); skipped when unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated per request, not at definition time.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Pattern tables (regular expressions) are clearer unwrapped.
"app/services/answering/safety.py" = ["E501"]
"app/services/answering/facts.py" = ["E501"]
"tests/**" = ["S101", "S105", "S106"]
# Reuses fixtures imported from test_answering_api (pytest injects them by parameter name).
"tests/integration/test_ai_api.py" = ["S101", "S105", "S106", "F811"]
"tests/integration/test_inbox_api.py" = ["S101", "S105", "S106", "F811"]
"tests/integration/test_domain_recheck.py" = ["S101", "S105", "S106", "F811"]
"tests/integration/test_evaluation.py" = ["S101", "S105", "S106", "F811"]
"tests/integration/test_worker.py" = ["S101", "S105", "S106", "F811"]
"tests/test_scheduling.py" = ["S101", "S105", "S106", "E501"]
"tests/integration/test_booking_api.py" = ["S101", "S105", "S106", "F811", "E501"]
# Evaluation data table: one case per line is easier to review.
"tests/integration/eval_cases.py" = ["E501"]
