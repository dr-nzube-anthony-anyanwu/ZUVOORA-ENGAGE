name: quality-and-security-baseline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Database (migrations, lint, pgTAP RLS tests) + API (unit and integration tests) against an
  # ephemeral LOCAL Supabase stack on the runner. No cloud project or real secrets are used.
  database-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Start local Supabase (applies migrations and local seed)
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor
      - name: Database lint
        run: npx supabase db lint --level warning --fail-on warning
      - name: RLS / tenancy tests (pgTAP)
        run: npx supabase test db
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        working-directory: apps/api
        run: ruff check .
      - name: Build widget (served by the API)
        working-directory: apps/widget
        run: |
          npm ci
          npm run build
      - name: Python dependency audit (known vulnerabilities)
        working-directory: apps/api
        run: |
          pip install "pip-audit>=2.9,<3"
          pip-audit --skip-editable
      - name: API unit + integration tests
        working-directory: apps/api
        run: pytest -rs
      # ----- Dashboard end-to-end tests (real browser -> dashboard -> API -> local Supabase) -----
      - name: Export local Supabase settings for E2E (local demo values, masked anyway)
        run: |
          node node_modules/supabase/dist/supabase.js status -o json > "$RUNNER_TEMP/sb.json"
          for key in PUBLISHABLE_KEY SECRET_KEY; do echo "::add-mask::$(jq -r .$key "$RUNNER_TEMP/sb.json")"; done
          DB_HOST=$(jq -r .DB_URL "$RUNNER_TEMP/sb.json" | sed 's/.*@//')
          {
            echo "E2E_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/sb.json")"
            echo "E2E_SUPABASE_DB_URL=$(jq -r .DB_URL "$RUNNER_TEMP/sb.json")"
            echo "E2E_SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY "$RUNNER_TEMP/sb.json")"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/sb.json")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/sb.json")"
            echo "SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/sb.json")"
            echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY "$RUNNER_TEMP/sb.json")"
            echo "DATABASE_URL=postgresql://engage_api:local-dev-only-engage-api@${DB_HOST}"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/sb.json"
      - name: Install and build dashboard for the local stack
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Dashboard E2E tests (Playwright)
        working-directory: apps/web
        env:
          APP_ENV: test
          DASHBOARD_URL: http://localhost:3073
          API_CORS_ORIGINS: http://localhost:3073
          ENGAGE_API_URL: http://127.0.0.1:8073
          E2E_PYTHON: python
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Build (browser-safe placeholder config only)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - name: No server secrets in browser bundles
        run: npm run check:bundle
  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/widget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/widget/package-lock.json
      - run: npm ci
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
      - run: npm run build
  # ----- Phase 6: deployment assets (no server, no registry, no secrets) -----------------------
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The same pinned scanner image production uses (deploy/compose.yml).
      clamav:
        image: clamav/clamav@sha256:64e30c0bf976198024deb3dc6d5cfe2485fb969c0f73549ba0fdb364b9469614
        ports: ["3310:3310"]
        options: >-
          --health-cmd clamdcheck.sh --health-interval 15s --health-timeout 10s
          --health-retries 20 --health-start-period 120s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose files follow the hardening policy (no published ports, limits, read-only...)
        run: |
          docker compose -p engage-ci --env-file deploy/env/ci-policy.env -f deploy/compose.yml             config --format json | python3 deploy/scripts/check_compose_policy.py app
          docker compose -f deploy/proxy/compose.yml config --format json             | python3 deploy/scripts/check_compose_policy.py proxy
      - name: Shell scripts (shellcheck)
        run: shellcheck --severity=warning deploy/scripts/*.sh
      - name: Preflight script tests (as root, throwaway values)
        run: sudo bash deploy/scripts/test_preflight.sh
      - name: Real ClamAV detects the EICAR test file
        working-directory: apps/api
        env:
          CLAMAV_LIVE_HOST: 127.0.0.1
        run: |
          python3 -m pip install "pytest>=9.0.3,<10"
          python3 -m pytest -p no:cacheprovider --noconftest -rs tests/test_clamav_live.py
      - name: Build images (placeholder public values; nothing is pushed)
        run: |
          docker build -f apps/api/Dockerfile -t engage-api:ci .
          docker build --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.invalid             --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder             -t engage-web:ci apps/web
      - name: Image scan, API (HIGH/CRITICAL with a fix available fail the build)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: engage-api:ci
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Image scan, dashboard
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: engage-web:ci
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Containers run as non-root
        run: |
          test "$(docker run --rm --entrypoint id engage-api:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id engage-web:ci -u)" = "10001"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
