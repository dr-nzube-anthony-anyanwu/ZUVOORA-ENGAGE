name: quality-and-security-baseline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Database (migrations, lint, pgTAP RLS tests) + API (unit and integration tests) against an
  # ephemeral LOCAL Supabase stack on the runner. No cloud project or real secrets are used.
  database-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Start local Supabase (applies migrations and local seed)
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor
      - name: Database lint
        run: npx supabase db lint --level warning --fail-on warning
      - name: RLS / tenancy tests (pgTAP)
        run: npx supabase test db
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        working-directory: apps/api
        run: ruff check .
      - name: API unit + integration tests
        working-directory: apps/api
        run: pytest -rs
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build (browser-safe placeholder config only)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - name: No server secrets in browser bundles
        run: npm run check:bundle
  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/widget/package-lock.json
      - run: npm ci
      - run: npm run build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
