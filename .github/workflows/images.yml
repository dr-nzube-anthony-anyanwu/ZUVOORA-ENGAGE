name: images
# Phase 6 (ADR-043): build, scan and publish container images for a RELEASE TAG (v*). This never
# deploys: a person deploys a published digest with deploy/scripts/deploy.sh on the server.
#
# Repository variables needed (Settings -> Secrets and variables -> Actions -> Variables; these are
# PUBLIC browser values, not secrets):
#   STAGING_SUPABASE_URL, STAGING_SUPABASE_PUBLISHABLE_KEY,
#   PRODUCTION_SUPABASE_URL, PRODUCTION_SUPABASE_PUBLISHABLE_KEY
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the public build values exist
        env:
          S_URL: ${{ vars.STAGING_SUPABASE_URL }}
          S_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          P_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          P_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for v in S_URL S_KEY P_URL P_KEY; do
            test -n "${!v}" || { echo "repository variable for $v is not set"; exit 1; }
          done
          case "$S_KEY$P_KEY" in *sb_secret_*) echo "a SECRET key was given as a public value"; exit 1;; esac
      - name: Build
        env:
          S_URL: ${{ vars.STAGING_SUPABASE_URL }}
          S_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          P_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          P_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          owner="$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER=$owner" >> "$GITHUB_ENV"
          # The source label connects each GHCR package to this repository, so the workflow token
          # may write to it (v0.6.0 was refused: "denied").
          src="org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          docker build -f apps/api/Dockerfile --label "$src" -t "$owner/zuvoora-engage-api:$TAG" .
          docker build --label "$src" -t "$owner/zuvoora-engage-web-staging:$TAG" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$S_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$S_KEY" \
            apps/web
          docker build --label "$src" -t "$owner/zuvoora-engage-web-production:$TAG" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$P_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$P_KEY" \
            apps/web
      - name: Scan API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: ${{ env.OWNER }}/zuvoora-engage-api:${{ env.TAG }}
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan dashboard image (production build)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: ${{ env.OWNER }}/zuvoora-engage-web-production:${{ env.TAG }}
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Publish and record digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          {
            echo "## Release $TAG — image digests"
            echo
            echo "Deploy with (on the server):"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # The digest is read back from the REGISTRY: with Docker's containerd image store (default
          # on current runners) `docker image inspect` has no RepoDigests after a push (v0.6.0 failed
          # here after pushing the API image).
          ref() {
            local d
            d="$(docker buildx imagetools inspect "$OWNER/$1:$TAG" --format '{{.Manifest.Digest}}')"
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for $1" >&2; return 1; }
            echo "$OWNER/$1@$d"
          }
          for name in zuvoora-engage-api zuvoora-engage-web-staging zuvoora-engage-web-production; do
            echo "pushing $name:$TAG"
            docker push --quiet "$OWNER/$name:$TAG"
            echo "- \`$(ref "$name")\`" >> "$GITHUB_STEP_SUMMARY"
          done
          api="$(ref zuvoora-engage-api)"
          ws="$(ref zuvoora-engage-web-staging)"
          wp="$(ref zuvoora-engage-web-production)"
          {
            echo
            echo '```'
            echo "sudo deploy/scripts/deploy.sh staging    $api $ws"
            echo "sudo deploy/scripts/deploy.sh production $api $wp"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
