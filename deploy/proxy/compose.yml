# ZUVOORA Engage edge proxy (Phase 6, ADR-043): the only container that publishes ports.
#
#   sudo docker compose -p engage-proxy -f deploy/proxy/compose.yml up -d --wait
#
# It joins each environment's edge network (created by deploy/scripts/deploy.sh) and nothing
# else. Certificates are mounted read-only from /opt/zuvoora-engage/proxy/certs (root only).

services:
  caddy:
    image: ${ENGAGE_CADDY_IMAGE:-caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0}
    container_name: engage-proxy
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    tmpfs: ["/tmp:size=16m", "/config:size=8m", "/data:size=16m"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/zuvoora-engage/proxy/certs:/etc/caddy/certs:ro
    healthcheck:
      # Caddy's admin API is off; check that the config is valid and the process answers on 80.
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [edge-prod, edge-staging]

networks:
  edge-prod:
    external: true
    name: engage-edge-prod
  edge-staging:
    external: true
    name: engage-edge-staging
